<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗼 Tokyo Food Finder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { display: flex; flex-direction: column; background: #f8fafc; color: #1e293b; }
body.dark { background: #0f172a; color: #e2e8f0; }
/* Header */
#header { background: #10b981; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.2); z-index: 1000; position: relative; }
body.dark #header { background: #064e3b; }
#header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; white-space: nowrap; }
#stats-line { font-size: 0.78rem; opacity: .9; white-space: nowrap; }
#dark-toggle { background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
#dark-toggle:hover { background: rgba(255,255,255,.35); }
/* Layout */
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 280px; background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; flex-shrink: 0; transition: transform .25s; z-index: 500; }
body.dark #sidebar { background: #1e293b; border-color: #334155; }
#map { flex: 1; }
/* Sidebar inner */
#sidebar-inner { padding: 14px; }
.filter-section { margin-bottom: 14px; }
.filter-section h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin-bottom: 6px; }
body.dark .filter-section h3 { color: #94a3b8; }
select, input[type=text] { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; background: #f8fafc; color: #1e293b; }
body.dark select, body.dark input[type=text] { background: #0f172a; border-color: #475569; color: #e2e8f0; }
.checkbox-list { display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; }
.checkbox-list label { display: flex; align-items: center; gap: 7px; font-size: 0.84rem; cursor: pointer; }
.checkbox-list input[type=checkbox] { accent-color: #10b981; width: 15px; height: 15px; }
.cat-count { color: #94a3b8; font-size: 0.75rem; margin-left: auto; }
#top-picks-label { display: flex; align-items: center; gap: 7px; font-size: 0.88rem; cursor: pointer; }
#top-picks-label input { accent-color: #10b981; width: 15px; height: 15px; }
button.reset-btn { width: 100%; padding: 8px; border: 1px solid #10b981; background: transparent; color: #10b981; border-radius: 8px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; }
button.reset-btn:hover { background: #10b981; color: #fff; }
body.dark button.reset-btn { border-color: #34d399; color: #34d399; }
body.dark button.reset-btn:hover { background: #34d399; color: #0f172a; }
/* Floating toggle for sidebar */
#sidebar-toggle { display: none; position: fixed; bottom: 70px; left: 12px; z-index: 2000; background: #10b981; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
body.dark #sidebar-toggle { background: #064e3b; }
#gps-btn { position: fixed; bottom: 16px; left: 12px; z-index: 2000; background: #3b82f6; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
#gps-btn.active { background: #ef4444; }
/* Legend */
#legend { position: fixed; bottom: 16px; right: 12px; z-index: 2000; background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 0.78rem; }
body.dark #legend { background: #1e293b; color: #e2e8f0; }
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
/* Popup */
.popup-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
.popup-name-jp { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
.popup-ratings { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.rating-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; text-decoration: none; }
.rating-chip.tabelog { background: #fef3c7; color: #92400e; }
.rating-chip.google { background: #dbeafe; color: #1e40af; }
.rating-chip:hover { opacity: .85; }
.popup-meta { font-size: 0.82rem; line-height: 1.7; }
.popup-meta span { display: block; }
@media (max-width: 767px) {
  #sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); box-shadow: 2px 0 12px rgba(0,0,0,.2); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-toggle { display: flex; align-items: center; justify-content: center; }
  #header h1 { font-size: 1rem; }
  #stats-line { display: none; }
}
</style>
</head>
<body>
<div id="header">
  <h1>🗼 Tokyo Food Finder</h1>
  <span id="stats-line">2198 Restaurants &bull; Tabelog 3.4+ &cap; Google 4.2+</span>
  <button id="dark-toggle">🌙 Dark</button>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sidebar-inner">
      <div class="filter-section">
        <h3>Tabelog Rating</h3>
        <select id="tabelog-min">
          <option value="3.4">3.4+</option>
          <option value="3.6">3.6+</option>
          <option value="3.8">3.8+</option>
          <option value="4.0">4.0+</option>
        </select>
      </div>
      <div class="filter-section">
        <h3>Google Rating</h3>
        <select id="google-min">
          <option value="4.2">4.2+</option>
          <option value="4.5">4.5+</option>
          <option value="4.7">4.7+</option>
          <option value="4.9">4.9+</option>
        </select>
      </div>
      <div class="filter-section">
        <h3>Min Google Reviews</h3>
        <select id="reviews-min">
          <option value="0">Any</option>
          <option value="50">50+</option>
          <option value="100">100+</option>
          <option value="500">500+</option>
        </select>
      </div>
      <div class="filter-section">
        <h3>Cuisine</h3>
        <div class="checkbox-list" id="cuisine-checks">
          <!-- populated by JS -->
        </div>
      </div>
      <div class="filter-section">
        <h3>Area / Address</h3>
        <input type="text" id="area-search" placeholder="e.g. Shinjuku, Ginza...">
      </div>
      <div class="filter-section">
        <label id="top-picks-label">
          <input type="checkbox" id="top-picks"> ⭐ Top picks only
        </label>
      </div>
      <button class="reset-btn" id="reset-filters">Reset Filters</button>
    </div>
  </div>
  <div id="map"></div>
</div>
<button id="sidebar-toggle" title="Toggle filters">⚙</button>
<button id="gps-btn" title="Toggle GPS">📍</button>
<div id="legend">
  <div style="font-weight:600;margin-bottom:5px">Tabelog</div>
  <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span> 4.0+</div>
  <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> 3.7–3.99</div>
  <div class="legend-item"><span class="legend-dot" style="background:#8b5cf6"></span> &lt;3.7</div>
</div>

var COUNTS  = {"Sushi": 186, "Ramen": 172, "Tempura": 45, "Yakitori": 100, "Yakiniku": 136, "Tonkatsu": 42, "Unagi": 33, "Japanese": 297, "Soba": 49, "Udon": 31, "Curry": 130, "Bakery": 97, "Desserts": 175, "Pizza": 17, "Other": 866};
var CATS    = ["Sushi", "Ramen", "Tempura", "Yakitori", "Yakiniku", "Tonkatsu", "Unagi", "Japanese", "Soba", "Udon", "Curry", "Bakery", "Desserts", "Pizza"];
var TOTAL   = 2198;
var TOP15_THRESHOLD = 0.8731210191082803;

// ── Dark mode ─────────────────────────────────────────────────────────
var darkMode = localStorage.getItem('darkMode') === 'true';
function applyDark() {
  document.body.classList.toggle('dark', darkMode);
  document.getElementById('dark-toggle').textContent = darkMode ? '☀ Light' : '🌙 Dark';
  if (window.lightLayer && window.darkLayer && window.map) {
    if (darkMode) {
      if (map.hasLayer(lightLayer)) { map.removeLayer(lightLayer); map.addLayer(darkLayer); }
    } else {
      if (map.hasLayer(darkLayer)) { map.removeLayer(darkLayer); map.addLayer(lightLayer); }
    }
  }
}
applyDark();
document.getElementById('dark-toggle').addEventListener('click', function() {
  darkMode = !darkMode;
  localStorage.setItem('darkMode', darkMode);
  applyDark();
});

// ── Map init ──────────────────────────────────────────────────────────
var map = L.map('map').setView([35.6762, 139.6503], 12);

var lightLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
});
var darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19
});
window.lightLayer = lightLayer;
window.darkLayer  = darkLayer;
window.map = map;
(darkMode ? darkLayer : lightLayer).addTo(map);

// ── Cuisine checkboxes ────────────────────────────────────────────────
var container = document.getElementById('cuisine-checks');
CATS.forEach(function(cat) {
  var lbl = document.createElement('label');
  var cb  = document.createElement('input');
  cb.type = 'checkbox';
  cb.value = cat;
  cb.dataset.cat = cat;
  cb.className = 'cat-cb';
  cb.addEventListener('change', applyFilters);
  var cnt = document.createElement('span');
  cnt.className = 'cat-count';
  cnt.textContent = '(' + (COUNTS[cat] || 0) + ')';
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(' ' + cat));
  lbl.appendChild(cnt);
  container.appendChild(lbl);
});

// ── Cluster group ─────────────────────────────────────────────────────
var clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true
});
map.addLayer(clusterGroup);

// ── Helpers ───────────────────────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
          Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function walkTime(km) {
  var mins = Math.round(km / 5 * 60);
  if (mins < 1) return '< 1 min';
  if (mins < 60) return mins + ' min';
  return Math.floor(mins/60) + 'h ' + (mins%60) + 'min';
}
function markerColor(tabelog) {
  if (tabelog >= 4.0) return '#10b981';
  if (tabelog >= 3.7) return '#3b82f6';
  return '#8b5cf6';
}
function makePopup(p) {
  var nameJpPart = (p.name_jp && p.name_jp !== p.name)
    ? '<div class="popup-name-jp">' + escHtml(p.name_jp) + '</div>' : '';
  var tabelogSearch = 'https://tabelog.com/en/rstLst/?sw=' + encodeURIComponent(p.name_jp || p.name);
  var gmapsUrl = p.place_id
    ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name) + '&query_place_id=' + encodeURIComponent(p.place_id)
    : 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng;
  var distHtml = '';
  if (userLat !== null) {
    var km = haversine(userLat, userLng, p.lat, p.lng);
    distHtml = '<span>🚶 ' + walkTime(km) + ' (' + km.toFixed(2) + ' km)</span>';
  }
  return '<div class="popup-title">' + escHtml(p.name) + '</div>'
       + nameJpPart
       + '<div class="popup-ratings">'
       + '<a class="rating-chip tabelog" href="' + tabelogSearch + '" target="_blank" rel="noopener">📊 Tabelog: ' + p.tabelog_rating.toFixed(2) + '</a>'
       + '<a class="rating-chip google" href="' + gmapsUrl + '" target="_blank" rel="noopener">⭐ Google: ' + p.google_rating.toFixed(1) + '</a>'
       + '</div>'
       + '<div class="popup-meta">'
       + '<span>💬 ' + (p.google_reviews || 0).toLocaleString() + ' reviews</span>'
       + '<span>🍽️ ' + escHtml(p.cuisine || 'N/A') + '</span>'
       + '<span>📍 ' + escHtml(p.area || p.address || '') + '</span>'
       + distHtml
       + '</div>';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Pre-build markers array ────────────────────────────────────────────
var allMarkers = [];
GEOJSON.features.forEach(function(feat) {
  var p   = feat.properties;
  var coords = feat.geometry.coordinates;
  var color = markerColor(p.tabelog_rating);
  var m = L.circleMarker([coords[1], coords[0]], {
    radius: 7,
    fillColor: color,
    color: '#fff',
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85
  });
  m.bindPopup(function() { return makePopup(p); }, { maxWidth: 280 });
  m._foodProps = p;
  allMarkers.push(m);
});

// ── Filter logic ──────────────────────────────────────────────────────
var userLat = null, userLng = null;

function applyFilters() {
  var tMin   = parseFloat(document.getElementById('tabelog-min').value);
  var gMin   = parseFloat(document.getElementById('google-min').value);
  var rMin   = parseInt(document.getElementById('reviews-min').value, 10);
  var areaQ  = document.getElementById('area-search').value.trim().toLowerCase();
  var topOnly= document.getElementById('top-picks').checked;
  var checkedCats = [];
  document.querySelectorAll('.cat-cb:checked').forEach(function(cb) {
    checkedCats.push(cb.value);
  });
  clusterGroup.clearLayers();
  var shown = 0;
  allMarkers.forEach(function(m) {
    var p = m._foodProps;
    if (p.tabelog_rating < tMin) return;
    if (p.google_rating  < gMin) return;
    if (p.google_reviews < rMin) return;
    if (checkedCats.length > 0) {
      var match = checkedCats.some(function(c) { return p.categories.indexOf(c) !== -1; });
      if (!match) return;
    }
    if (areaQ) {
      var haystack = ((p.area || '') + ' ' + (p.address || '')).toLowerCase();
      if (haystack.indexOf(areaQ) === -1) return;
    }
    if (topOnly) {
      var score = (p.tabelog_rating / 4.71) * 0.5 + (p.google_rating / 5.0) * 0.5;
      if (score < TOP15_THRESHOLD) return;
    }
    clusterGroup.addLayer(m);
    shown++;
  });
  document.getElementById('stats-line').textContent =
    shown.toLocaleString() + ' Restaurants' + (shown < TOTAL ? ' (filtered)' : '') +
    ' \u2022 Tabelog 3.4+ \u2229 Google 4.2+';
}
applyFilters();

// ── Filter event wiring ───────────────────────────────────────────────
['tabelog-min','google-min','reviews-min'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', applyFilters);
});
document.getElementById('area-search').addEventListener('input', applyFilters);
document.getElementById('top-picks').addEventListener('change', applyFilters);

document.getElementById('reset-filters').addEventListener('click', function() {
  document.getElementById('tabelog-min').value = '3.4';
  document.getElementById('google-min').value  = '4.2';
  document.getElementById('reviews-min').value = '0';
  document.getElementById('area-search').value = '';
  document.getElementById('top-picks').checked  = false;
  document.querySelectorAll('.cat-cb').forEach(function(cb) { cb.checked = false; });
  applyFilters();
});

// ── Sidebar toggle (mobile) ───────────────────────────────────────────
var sidebar = document.getElementById('sidebar');
var toggleBtn = document.getElementById('sidebar-toggle');
function isMobile() { return window.innerWidth < 768; }
if (isMobile()) { sidebar.classList.remove('open'); }
toggleBtn.addEventListener('click', function() {
  sidebar.classList.toggle('open');
});
// close sidebar when clicking map on mobile
document.getElementById('map').addEventListener('click', function() {
  if (isMobile()) sidebar.classList.remove('open');
});

// ── GPS ───────────────────────────────────────────────────────────────
var gpsBtn       = document.getElementById('gps-btn');
var gpsWatchId   = null;
var userMarker   = null;
gpsBtn.addEventListener('click', function() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    userLat = null; userLng = null;
    gpsBtn.classList.remove('active');
    return;
  }
  if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
  gpsBtn.classList.add('active');
  gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    if (userMarker) { map.removeLayer(userMarker); }
    userMarker = L.circleMarker([userLat, userLng], {
      radius: 9, fillColor: '#ef4444', color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map);
    map.setView([userLat, userLng], 15);
  }, function() {
    alert('Unable to retrieve location.');
    gpsBtn.classList.remove('active');
  }, { enableHighAccuracy: true });
});

// ── Service Worker ────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.register('/tokyo-food-finder/sw.js');
  } catch(e) {
    console.warn('SW registration failed:', e);
  }
}

})();
</script>
